    <script>
      // No computador, links wa.me abrem uma página intermediária ou o app do Windows.
      // Aqui eles vão direto para o WhatsApp Web, sempre na mesma aba.
      (function () {
        var celular = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || !!window.Capacitor;
        if (celular) return;
        document.addEventListener('click', function (ev) {
          if (ev.defaultPrevented || ev.button !== 0) return;
          var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
          if (!a) return;
          var url;
          try { url = new URL(a.href); } catch (e) { return; }
          if (url.hostname !== 'wa.me' && url.hostname !== 'api.whatsapp.com') return;
          var numero = url.hostname === 'wa.me' ? url.pathname.replace(/\D/g, '') : (url.searchParams.get('phone') || '').replace(/\D/g, '');
          var destino = 'https://web.whatsapp.com/send?' + (numero ? 'phone=' + numero + '&' : '') +
            'text=' + encodeURIComponent(url.searchParams.get('text') || '');
          ev.preventDefault();
          window.open(destino, 'whatsapp_web');
        }, true);
      })();
    </script>
