<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B3F">
<meta name="description" content="Agenda dos campos de futebol com atendimento por IA no WhatsApp.">
<title>Campos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
 --bg:#F6F7F5; --sup:#FFFFFF; --txt:#1B1F1C; --txt2:#4A544D; --borda:#D5DBD6;
 --pri:#2E6B3F; --pri-txt:#FFFFFF; --pri-suave:#E3EFE6; --erro:#B3261E; --aviso:#7A5200;
 --livre-bg:#E7F4EA; --livre-tx:#1E5A2E;
 --conf-bg:#DCE8F7; --conf-tx:#1D4A80;
 --pend-bg:#FFF1CC; --pend-tx:#6B4E00;
 --naovem-bg:#ECECEC; --naovem-tx:#555555;
 --avp-bg:#FFE4CC; --avp-tx:#8A3D00;
 --pago-bg:#CFEBD6; --pago-tx:#14532D;
 --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#111613; --sup:#1A211C; --txt:#E6ECE7; --txt2:#A8B3AB; --borda:#2F3A32;
 --pri:#5FB57A; --pri-txt:#0B1A10; --pri-suave:#1E3325; --erro:#F2B8B5; --aviso:#F3D27A;
 --livre-bg:#16301F; --livre-tx:#9FE0B0; --conf-bg:#172A44; --conf-tx:#A9C8F2;
 --pend-bg:#3A2E0A; --pend-tx:#F3D27A; --naovem-bg:#2A2A2A; --naovem-tx:#BDBDBD;
 --avp-bg:#3D2410; --avp-tx:#FFB880; --pago-bg:#12351F; --pago-tx:#8EE3A8;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header.topo{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;gap:8px;min-height:60px}
header.topo h1{font-size:22px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:0 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px)}
h2{font-size:18px;font-weight:600;margin:16px 0 8px}
p{margin:8px 0}
.leg{color:var(--txt2)}
.card{background:var(--sup);border:1px solid var(--borda);border-radius:12px;padding:16px;margin:12px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;border:2px solid var(--pri);background:var(--pri);color:var(--pri-txt);font-weight:600;padding:8px 16px;cursor:pointer;text-align:center}
.btn.sec{background:transparent;color:var(--pri)}
.btn.perigo{background:transparent;border-color:var(--borda);color:var(--erro)}
.btn:disabled{opacity:.6;cursor:default}
.btn+.btn{margin-top:8px}
.linha{display:flex;gap:8px}
.linha>*{flex:1;min-width:0}
.linha .btn+.btn{margin-top:0}
.ico{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--borda);background:var(--sup);font-size:22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;min-height:52px;border:1px solid var(--borda);border-radius:12px;background:var(--sup);padding:12px;outline:none}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;border-radius:999px;padding:6px 12px;font-size:16px;white-space:nowrap}
.navdata{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.navdata .d{flex:1;text-align:center;font-size:18px;font-weight:700}
.grade{display:grid;grid-template-columns:56px repeat(var(--nc,2),minmax(0,1fr));gap:8px}
.grade .hh{font-size:18px;font-weight:700;display:flex;align-items:center}
.grade .cab{font-weight:600;text-align:center;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cel{min-height:64px;border-radius:12px;border:0;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;overflow:hidden;word-break:break-word}
.cel b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cel small{font-size:16px}
.livre{background:var(--livre-bg);color:var(--livre-tx)}
.conf{background:var(--conf-bg);color:var(--conf-tx)}
.pend{background:var(--pend-bg);color:var(--pend-tx);border-left:4px solid var(--pend-tx)}
.naovem{background:var(--naovem-bg);color:var(--naovem-tx)}
.naovem b{text-decoration:line-through}
.avp{background:var(--avp-bg);color:var(--avp-tx);border-left:4px solid var(--avp-tx)}
.pago{background:var(--pago-bg);color:var(--pago-tx)}
.vazio{text-align:center;padding:32px 8px;color:var(--txt2)}
.vazio .g{font-size:48px;line-height:1}
.selo{display:inline-block;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:600}
.cli{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;min-height:64px}
.cli .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli>div{flex:1;min-width:0}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);width:56px;height:56px;border-radius:16px;border:0;background:var(--pri);color:var(--pri-txt);font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;z-index:6}
nav.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--sup);border-top:1px solid var(--borda);display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
nav.barra button{flex:1;min-width:0;min-height:48px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--txt2);cursor:pointer;padding:4px 0}
nav.barra .pil{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px}
nav.barra svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.barra button[aria-current=page]{color:var(--pri);font-weight:600}
nav.barra button[aria-current=page] .pil{background:var(--pri-suave)}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sup);border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .2s}
.folha.aberta{transform:none}
.fundo.aberta{display:block}
.alca{width:40px;height:5px;border-radius:3px;background:var(--borda);margin:4px auto 12px}
.folha h3{font-size:18px;margin:0 0 4px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);z-index:30;background:var(--txt);color:var(--bg);border-radius:12px;padding:12px 16px;display:none;align-items:center;gap:12px;min-height:52px}
#toast.on{display:flex}
#toast span{flex:1}
#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;min-height:44px;cursor:pointer}
.faixa{background:var(--pri-suave);color:var(--txt);border-radius:12px;padding:12px;margin:8px 0}
.aviso{background:var(--pend-bg);color:var(--pend-tx);border-radius:12px;padding:12px;margin:8px 0}
.erro{color:var(--erro);font-weight:600}
details.card{padding:0}
details.card>summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:18px;font-weight:600}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--txt2)}
details.card[open]>summary::after{content:"▴"}
details.card>.corpo{padding:0 16px 16px}
.hist{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.cliente{background:var(--bg);border:1px solid var(--borda);align-self:flex-start}
.msg.dono{background:var(--pri-suave);align-self:flex-end}
.fixo-linha{display:grid;grid-template-columns:1fr 1fr 1fr 48px;gap:6px;margin:6px 0}
.fixo-linha select{padding:8px 4px}
.qr{display:block;max-width:260px;width:100%;margin:12px auto;background:#fff;border-radius:12px}
.oculto{display:none!important}
.pensa{white-space:pre-wrap}
.passos{margin:8px 0;padding-left:24px}
.passos li{margin:8px 0}
a.lk{color:var(--pri);font-weight:700;display:inline-block;padding:10px 0;word-break:break-all}
.priv{background:var(--naovem-bg);color:var(--txt);border-radius:12px;padding:12px;margin:8px 0}
</style>
</head>
<body>
<header class="topo"><h1 id="titulo">Agenda</h1><div id="acaoTopo"></div></header>
<main id="tela" aria-live="polite"></main>
<nav class="barra" id="barra" aria-label="Menu">
 <button data-t="agenda"><span class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Agenda</button>
 <button data-t="clientes"><span class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/><circle cx="17" cy="9" r="2.5"/></svg></span>Clientes</button>
 <button data-t="confirmar"><span class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></span>Confirmar</button>
 <button data-t="ia"><span class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><circle cx="8" cy="10" r="1"/><circle cx="12" cy="10" r="1"/><circle cx="16" cy="10" r="1"/></svg></span>IA</button>
 <button data-t="ajustes"><span class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></span>Ajustes</button>
</nav>
<div class="fundo" id="fundo"></div>
<div class="folha" id="folha" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"><span id="toastTx"></span><button id="toastBt" class="oculto"></button></div>
<script id="core">
/* ===== Funções puras (sem DOM). Testadas em Node pelo test.js ===== */
var REGRAS_PADRAO = [
  'Horários de início (cada reserva dura 1 hora):',
  '- Segunda e quarta: 19h, 20h, 21h e 22h.',
  '- Terça e quinta: 20h, 21h e 22h.',
  '- Sexta: 17h, 18h, 19h, 20h, 21h e 22h.',
  '- Sábado: 8h e 9h.',
  '- Domingo: fechado.',
  'Temos 2 campos (Campo 1 e Campo 2).',
  'Clientes fixos têm prioridade. Avulsos só podem reservar horários livres.',
  'Confirmação dos fixos: no dia anterior de manhã; se não responder, nova tentativa à tarde.',
  'Preço: se não estiver informado, NUNCA invente valor. Diga que vai confirmar e já retorna.'
].join('\n');

var DIAS_CURTO = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
var DIAS_LONGO = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];

function defaults() {
  return {
    versao: 1,
    config: {
      nomeDono: '', regras: REGRAS_PADRAO, preco: '',
      grade: { 1: [19, 20, 21, 22], 2: [20, 21, 22], 3: [19, 20, 21, 22], 4: [20, 21, 22], 5: [17, 18, 19, 20, 21, 22], 6: [8, 9], 0: [] },
      campos: { 1: 'Campo 1', 2: 'Campo 2' },
      msgManha: 'Bom dia {nome}! Confirma o futebol amanhã ({dia}) às {hora}h no {campo}?',
      msgTarde: 'Oi {nome}, ainda não tive retorno: amanhã ({dia}) {hora}h no {campo}, confirma?',
      ia: { geminiKey: '', geminiModel: 'gemini-2.5-flash', groqKey: '', groqModel: 'llama-3.3-70b-versatile' },
      evo: { url: '', apikey: '', instancia: '' }
    },
    clientes: [], reservas: [], excecoes: [], confirmacoes: {}, conversas: [], ultimoBackup: 0
  };
}

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function ehObj(o) { return o !== null && typeof o === 'object' && !Array.isArray(o); }

function mesclaDefaults(salvo) {
  var d = defaults();
  if (!ehObj(salvo)) return d;
  var s = clone(salvo);
  var c = ehObj(s.config) ? s.config : {};
  var cfg = Object.assign({}, d.config, c);
  cfg.ia = Object.assign({}, d.config.ia, ehObj(c.ia) ? c.ia : {});
  cfg.evo = Object.assign({}, d.config.evo, ehObj(c.evo) ? c.evo : {});
  cfg.grade = Object.assign({}, d.config.grade, ehObj(c.grade) ? c.grade : {});
  cfg.campos = Object.assign({}, d.config.campos, ehObj(c.campos) ? c.campos : {});
  return {
    versao: 1, config: cfg,
    clientes: Array.isArray(s.clientes) ? s.clientes : [],
    reservas: Array.isArray(s.reservas) ? s.reservas : [],
    excecoes: Array.isArray(s.excecoes) ? s.excecoes : [],
    confirmacoes: ehObj(s.confirmacoes) ? s.confirmacoes : {},
    conversas: Array.isArray(s.conversas) ? s.conversas : [],
    ultimoBackup: typeof s.ultimoBackup === 'number' ? s.ultimoBackup : 0
  };
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}

/* ---- Datas (sempre locais, nunca toISOString) ---- */
function p2(n) { return (n < 10 ? '0' : '') + n; }
function dataLocal(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function parseData(s) { var a = String(s).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2], 12); }
function dataValida(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return false;
  return dataLocal(parseData(s)) === s;
}
function somaDias(s, n) { var d = parseData(s); d.setDate(d.getDate() + n); return dataLocal(d); }
function diaSemana(s) { return parseData(s).getDay(); }
function nomeDia(s) { return DIAS_CURTO[diaSemana(s)]; }
function formataDataBR(s) { var a = String(s).split('-'); return a[2] + '/' + a[1]; }
function chave(data, hora, campo) { return data + '|' + Number(hora) + '|' + Number(campo); }
function nomeCampo(db, campo) { return (db.config.campos && db.config.campos[campo]) || ('Campo ' + campo); }
function listaCampos(db) { return Object.keys(db.config.campos || { 1: 1, 2: 2 }).map(Number).sort(); }

/* ---- Agenda ---- */
function horariosDoDia(db, data) {
  var g = (db.config.grade || {})[diaSemana(data)] || [];
  return g.map(Number).sort(function (a, b) { return a - b; });
}
function clientePorId(db, id) {
  for (var i = 0; i < db.clientes.length; i++) if (db.clientes[i].id === id) return db.clientes[i];
  return null;
}
function fixoDe(db, data, hora, campo) {
  var dia = diaSemana(data);
  for (var i = 0; i < db.clientes.length; i++) {
    var c = db.clientes[i];
    if (c.tipo !== 'fixo' || !Array.isArray(c.fixos)) continue;
    for (var j = 0; j < c.fixos.length; j++) {
      var f = c.fixos[j];
      if (Number(f.dia) === dia && Number(f.hora) === Number(hora) && Number(f.campo) === Number(campo)) return c;
    }
  }
  return null;
}
function temExcecao(db, data, hora, campo, clienteId) {
  return db.excecoes.some(function (e) {
    return e.data === data && Number(e.hora) === Number(hora) && Number(e.campo) === Number(campo) &&
      (clienteId == null || e.clienteId === clienteId);
  });
}
function reservaEm(db, data, hora, campo) {
  for (var i = 0; i < db.reservas.length; i++) {
    var r = db.reservas[i];
    if (r.data === data && Number(r.hora) === Number(hora) && Number(r.campo) === Number(campo)) return r;
  }
  return null;
}
function statusDe(db, data, hora, campo) {
  var c = db.confirmacoes[chave(data, hora, campo)];
  return (c && c.status) || 'pendente';
}
function ocupante(db, data, hora, campo) {
  var r = reservaEm(db, data, hora, campo);
  if (r) return { tipo: 'avulso', reserva: r, cliente: clientePorId(db, r.clienteId) };
  var f = fixoDe(db, data, hora, campo);
  if (f && !temExcecao(db, data, hora, campo, f.id)) return { tipo: 'fixo', cliente: f, status: statusDe(db, data, hora, campo) };
  if (f) return { tipo: 'livre', naoVem: f };
  return { tipo: 'livre' };
}
function livresProximosDias(db, n, hoje) {
  var base = dataLocal(hoje), agoraH = hoje.getHours(), out = [], campos = listaCampos(db);
  for (var i = 0; i < n; i++) {
    var data = somaDias(base, i);
    horariosDoDia(db, data).forEach(function (h) {
      if (i === 0 && h <= agoraH) return;
      campos.forEach(function (c) {
        if (ocupante(db, data, h, c).tipo === 'livre') out.push({ data: data, dia: nomeDia(data), hora: h, campo: c });
      });
    });
  }
  return out;
}
function conflitoFixo(db, f, ignorarClienteId) {
  for (var i = 0; i < db.clientes.length; i++) {
    var c = db.clientes[i];
    if (c.id === ignorarClienteId || c.tipo !== 'fixo' || !Array.isArray(c.fixos)) continue;
    for (var j = 0; j < c.fixos.length; j++) {
      var x = c.fixos[j];
      if (Number(x.dia) === Number(f.dia) && Number(x.hora) === Number(f.hora) && Number(x.campo) === Number(f.campo)) return c;
    }
  }
  return null;
}

/* ---- Textos ---- */
function normalizaTelefone(s) {
  var d = String(s == null ? '' : s).replace(/\D/g, '').replace(/^0+/, '');
  if (d.length === 10 || d.length === 11) d = '55' + d;
  return d;
}
function telefoneOk(s) { var d = normalizaTelefone(s); return /^55\d{10,11}$/.test(d) || (d.length >= 12 && d.length <= 15 && d.indexOf('55') !== 0); }
function preencheModelo(tpl, v) {
  v = v || {};
  return String(tpl || '').replace(/\{(nome|dia|hora|campo)\}/g, function (_, k) { return v[k] == null ? '' : String(v[k]); });
}
function periodoDoDia(hora) { return hora < 12 ? 'manha' : (hora < 18 ? 'tarde' : 'noite'); }
function proximoStatus(s) {
  if (s === 'pendente' || !s) return 'manha';
  if (s === 'manha' || s === 'tarde') return 'tarde';
  return s;
}
function cortaConversa(texto, max) {
  if (max == null) max = 15000;
  texto = String(texto == null ? '' : texto);
  return texto.length > max ? texto.slice(texto.length - max) : texto;
}
function fixosDeAmanha(db, hoje) {
  var data = somaDias(dataLocal(hoje), 1), out = [];
  horariosDoDia(db, data).forEach(function (h) {
    listaCampos(db).forEach(function (c) {
      var f = fixoDe(db, data, h, c);
      if (!f) return;
      var st = temExcecao(db, data, h, c, f.id) ? 'nao_vem' : statusDe(db, data, h, c);
      out.push({ cliente: f, data: data, hora: h, campo: c, status: st });
    });
  });
  return out;
}
function textoConfirmacao(db, item) {
  var tpl = item.status === 'pendente' ? db.config.msgManha : db.config.msgTarde;
  return preencheModelo(tpl, {
    nome: (item.cliente.nome || '').split(' ')[0], dia: DIAS_LONGO[diaSemana(item.data)] + ' ' + formataDataBR(item.data),
    hora: item.hora, campo: nomeCampo(db, item.campo)
  });
}

/* ---- IA ---- */
var TIPOS_ACAO = ['nenhuma', 'reservar_avulso', 'nao_vem', 'confirmar', 'cancelar'];

function montaPrompt(db, cliente, hoje) {
  var cfg = db.config, L = [], hojeS = dataLocal(hoje);
  L.push('Você é o atendente de WhatsApp de um aluguel de 2 campos de futebol' + (cfg.nomeDono ? ', falando em nome de ' + cfg.nomeDono : '') + '.');
  L.push('Responda em português do Brasil, curto, simpático e direto, como mensagem de WhatsApp.');
  L.push('Hoje é ' + DIAS_LONGO[hoje.getDay()] + ', ' + formataDataBR(hojeS) + ' (' + hojeS + '), ' + hoje.getHours() + 'h.');
  L.push('\nREGRAS DO NEGÓCIO:\n' + (cfg.regras || ''));

  async function fetchTempo(url, init, ms) {
    var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, ms || 25000);
    try { return await fetch(url, Object.assign({}, init, { signal: ctl.signal })); }
    finally { clearTimeout(t); }
  }
  async function chamarIA(req, ler) {
    var resp;
    try { resp = await fetchTempo(req.url, req.init, 25000); }
    catch (e) {
      var err = new Error(!navigator.onLine ? erroAmigavel(0) : (e && e.name === 'AbortError' ? 'A IA demorou demais. Tente de novo.' : 'Sem internet. A agenda funciona, mas a IA e o envio não.'));
      err.trocar = true; throw err;
    }
    if (!resp.ok) {
      var corpo = ''; try { corpo = await resp.text(); } catch (e2) { /* ignora */ }
      var er = new Error(erroAmigavel(resp.status, corpo)); er.trocar = true; er.status = resp.status; throw er;
    }
    var j = await resp.json(), tx = ler(j);
    if (!tx) { var e3 = new Error('A IA não respondeu. Tente de novo.'); e3.trocar = true; throw e3; }
    return tx;
  }

  async function conectarEvo() {
    var evo = db.config.evo, box = $('evoStatus');
    if (!evoConfigurada(evo)) { toast('⚠ Preencha endereço, chave e instância.', true); return; }
    if (box) box.innerHTML = '<p>Conectando…</p>';
    try {
      var resp = await fetchTempo(urlConectarEvo(evo), { method: 'GET', headers: { apikey: String(evo.apikey).trim() } }, 25000);
      if (!resp.ok) throw new Error(resp.status === 401 || resp.status === 403 ? 'Chave do servidor inválida.' : resp.status === 404 ? 'Instância não encontrada.' : 'O servidor respondeu com erro ' + resp.status + '.');

      if (!box) return;

      else if (q && q.qr) {
        box.innerHTML = '<p>No celular do WhatsApp: ⋮ › Aparelhos conectados › Conectar aparelho, e aponte para o código:</p><img class="qr" alt="Código QR do WhatsApp">';
        box.querySelector('img').src = q.qr;

    } catch (e) {
      if (box) box.innerHTML = '<p class="erro">⚠ ' + esc(!navigator.onLine ? 'Sem internet.' : (e.name === 'AbortError' ? 'O servidor demorou demais.' : (e.message && /^[A-ZÁÉÍÓÚO]/.test(e.message) && e.message.indexOf('Failed') < 0 ? e.message : 'Não consegui falar com o servidor. Confira o endereço.'))) + '</p>';
    }
  }

      var outro = conflitoFixo(db, f, est.editCli.id);
      render();
      if (outro) toast('⚠ Esse horário já é de outro cliente fixo. (' + outro.nome + ')', true);
    }
    else if (k === 'iaCli') { est.iaCli = el.value; est.iaResp = ''; est.iaAcao = null; render(); }
    else if (k === 'arqTxt') {
      var arqs = Array.prototype.slice.call(el.files || []), n = clone(db), qt = 0;
      for (var i = 0; i < arqs.length; i++) {
        try {
          var tx = await lerArquivo(arqs[i]);
          n.conversas = n.conversas.filter(function (c) { return c.nomeArquivo !== arqs[i].name; });
          n.conversas.push({ nomeArquivo: arqs[i].name, texto: cortaConversa(tx, 15000), importadoEm: Date.now() }); qt++;
        } catch (er) { /* pula arquivo ruim */ }
      }
      try { el.value = ''; } catch (er0) { /* ignora */ }
      if (qt) { muda(n, qt + (qt > 1 ? ' conversas importadas ✓' : ' conversa importada ✓')); var d = $('secIA'); if (d) d.open = true; }
      else toast('⚠ Não consegui ler o arquivo.', true);
    }
    else if (k === 'arqBk') {
      var a = el.files && el.files[0]; if (!a) return;
      var obj = null;
      try { obj = JSON.parse(await lerArquivo(a)); } catch (er2) { obj = null; }
      el.value = '';
      if (!validaBackup(obj)) { toast('⚠ Esse arquivo não é um backup válido.', true); return; }
      confirma('Os dados atuais deste celular serão trocados pelos da cópia (' + obj.clientes.length + ' clientes, ' + obj.reservas.length + ' reservas).', 'Recuperar cópia', function () {
        muda(limpaAntigos(mesclaDefaults(obj), new Date()), 'Cópia recuperada ✓', true);
      });
    }
  });
  var hojeVisto = dataLocal(new Date());
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    var h = dataLocal(new Date());
    if (h !== hojeVisto) {
      if (est.data === hojeVisto) est.data = h;
      hojeVisto = h; db = limpaAntigos(db, new Date()); salvar();
      if (!est.editCli) render();
    }
  });
  window.addEventListener('online', function () { if (est.tela === 'ia') render(); });
  window.addEventListener('offline', function () { toast('⚠ Sem internet. A agenda funciona, mas a IA e o envio não.'); if (est.tela === 'ia') render(); });

  render();

  try {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () { /* ignora */ }); });
    }
  } catch (e) { /* ignora */ }
})();
</script>
</body>
</html>
