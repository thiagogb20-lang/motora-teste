<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B3F">
<meta name="description" content="Motora Teste: agenda dos campos de futebol e IA que atende o WhatsApp.">
<title>Motora Teste</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
 --bg:#F6F7F5; --sup:#FFFFFF; --txt:#1B1F1C; --txt2:#4A544D; --borda:#D5DBD6;
 --pri:#2E6B3F; --pri-txt:#FFFFFF; --pri-suave:#E3EFE6; --erro:#B3261E; --aviso:#7A5200;
 --livre-bg:#E7F4EA; --livre-tx:#1E5A2E;
 --conf-bg:#DCE8F7; --conf-tx:#1D4A80;
 --pend-bg:#FFF1CC; --pend-tx:#6B4E00;
 --naovem-bg:#ECECEC; --naovem-tx:#555555;
 --avp-bg:#FFE4CC; --avp-tx:#8A3D00;
 --pago-bg:#CFEBD6; --pago-tx:#14532D;
 --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#111613; --sup:#1A211C; --txt:#E6ECE7; --txt2:#A8B3AB; --borda:#2F3A32;
 --pri:#5FB57A; --pri-txt:#0B1A10; --pri-suave:#1E3325; --erro:#F2B8B5; --aviso:#F3D27A;
 --livre-bg:#16301F; --livre-tx:#9FE0B0; --conf-bg:#172A44; --conf-tx:#A9C8F2;
 --pend-bg:#3A2E0A; --pend-tx:#F3D27A; --naovem-bg:#2A2A2A; --naovem-tx:#BDBDBD;
 --avp-bg:#3D2410; --avp-tx:#FFB880; --pago-bg:#12351F; --pago-tx:#8EE3A8;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header.topo{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;gap:8px;min-height:60px}
header.topo h1{font-size:22px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:0 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px)}
h2{font-size:18px;font-weight:600;margin:16px 0 8px}
p{margin:8px 0}
.leg{color:var(--txt2)}
.card{background:var(--sup);border:1px solid var(--borda);border-radius:12px;padding:16px;margin:12px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;border:2px solid var(--pri);background:var(--pri);color:var(--pri-txt);font-weight:600;padding:8px 16px;cursor:pointer;text-align:center}
.btn.sec{background:transparent;color:var(--pri)}
.btn.perigo{background:transparent;border-color:var(--borda);color:var(--erro)}
.btn:disabled{opacity:.6;cursor:default}
.btn+.btn{margin-top:8px}
.linha{display:flex;gap:8px}
.linha>*{flex:1;min-width:0}
.linha .btn+.btn{margin-top:0}
.ico{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--borda);background:var(--sup);font-size:22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;min-height:52px;border:1px solid var(--borda);border-radius:12px;background:var(--sup);padding:12px;outline:none}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;border-radius:999px;padding:6px 12px;font-size:16px;white-space:nowrap}
.navdata{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.navdata .d{flex:1;text-align:center;font-size:18px;font-weight:700}
.grade{display:grid;grid-template-columns:56px repeat(var(--nc,2),minmax(0,1fr));gap:8px}
.grade .hh{font-size:18px;font-weight:700;display:flex;align-items:center}
.grade .cab{font-weight:600;text-align:center;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cel{min-height:64px;border-radius:12px;border:0;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;overflow:hidden;word-break:break-word}
.cel b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cel small{font-size:16px}
.livre{background:var(--livre-bg);color:var(--livre-tx)}
.conf{background:var(--conf-bg);color:var(--conf-tx)}
.pend{background:var(--pend-bg);color:var(--pend-tx);border-left:4px solid var(--pend-tx)}
.naovem{background:var(--naovem-bg);color:var(--naovem-tx)}
.naovem b{text-decoration:line-through}
.avp{background:var(--avp-bg);color:var(--avp-tx);border-left:4px solid var(--avp-tx)}
.pago{background:var(--pago-bg);color:var(--pago-tx)}
.vazio{text-align:center;padding:32px 8px;color:var(--txt2)}
.vazio .g{font-size:48px;line-height:1}
.selo{display:inline-block;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:600}
.cli{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;min-height:64px}
.cli .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli>div{flex:1;min-width:0}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);width:56px;height:56px;border-radius:16px;border:0;background:var(--pri);color:var(--pri-txt);font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;z-index:6}
nav.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--sup);border-top:1px solid var(--borda);display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
nav.barra button{flex:1;min-width:0;min-height:48px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--txt2);cursor:pointer;padding:4px 0}
nav.barra .pil{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px}
nav.barra svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.barra button[aria-current=page]{color:var(--pri);font-weight:600}
nav.barra button[aria-current=page] .pil{background:var(--pri-suave)}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sup);border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .2s}
.folha.aberta{transform:none}
.fundo.aberta{display:block}
.alca{width:40px;height:5px;border-radius:3px;background:var(--borda);margin:4px auto 12px}
.folha h3{font-size:18px;margin:0 0 4px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);z-index:30;background:var(--txt);color:var(--bg);border-radius:12px;padding:12px 16px;display:none;align-items:center;gap:12px;min-height:52px}
#toast.on{display:flex}
#toast span{flex:1}
#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;min-height:44px;cursor:pointer}
.faixa{background:var(--pri-suave);color:var(--txt);border-radius:12px;padding:12px;margin:8px 0}
.aviso{background:var(--pend-bg);color:var(--pend-tx);border-radius:12px;padding:12px;margin:8px 0}
.erro{color:var(--erro);font-weight:600}
details.card{padding:0}
details.card>summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:18px;font-weight:600}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--txt2)}
details.card[open]>summary::after{content:"▴"}
details.card>.corpo{padding:0 16px 16px}
.hist{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.cliente{background:var(--bg);border:1px solid var(--borda);align-self:flex-start}
.msg.dono{background:var(--pri-suave);align-self:flex-end}
.fixo-linha{display:grid;grid-template-columns:1fr 1fr 1fr 48px;gap:6px;margin:6px 0}
.fixo-linha select{padding:8px 4px}
.qr{display:block;max-width:260px;width:100%;margin:12px auto;background:#fff;border-radius:12px}
.oculto{display:none!important}
.pensa{white-space:pre-wrap}
.passos{margin:8px 0;padding-left:24px}
.passos li{margin:8px 0}
a.lk{color:var(--pri);font-weight:700;display:inline-block;padding:10px 0;word-break:break-all}
.priv{background:var(--naovem-bg);color:var(--txt);border-radius:12px;padding:12px;margin:8px 0}

nav.barra button{position:relative}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:10px;background:var(--erro);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
@media (prefers-color-scheme:dark){.badge{color:#2a0b09}}
.ia-bt{flex-direction:column;min-height:112px;font-size:26px;letter-spacing:.5px;border-radius:20px;margin:8px 0 12px}
.ia-bt small{font-size:16px;font-weight:500}
.ia-bt.ia-off{background:var(--sup);color:var(--txt);border-color:var(--borda);border-width:3px}
.seg{display:flex;gap:8px;margin:0 0 8px}
.seg button{flex:1;min-width:0;min-height:64px;border-radius:12px;border:2px solid var(--borda);background:var(--sup);font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.seg button small{font-weight:400;color:var(--txt2);font-size:14px}
.seg button[aria-pressed=true]{border-color:var(--pri);background:var(--pri-suave);color:var(--pri)}
.conta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.conta>div{background:var(--sup);border:1px solid var(--borda);border-radius:12px;padding:10px 6px;text-align:center}
.conta b{display:block;font-size:26px}
.conta span{font-size:14px;color:var(--txt2)}
.rst{font-size:18px;font-weight:700}
.rst.ok{color:var(--pri)} .rst.erro{color:var(--erro)} .aviso-t{color:var(--aviso)}
.sug .n,.aviso-c{word-break:break-word}
.sug .msg{max-width:100%;margin:8px 0}
.msg small{display:block;font-size:13px;color:var(--txt2);margin-top:2px}
.msg.sugerida{border:2px dashed var(--pri);background:var(--pri-suave)}
.msg.ign{opacity:.6;text-decoration:line-through}
.hist{max-height:none}
.acao{background:var(--bg);border-radius:12px;padding:10px;margin:8px 0}
.selo.nl{background:var(--erro);color:#fff;margin-left:6px}
.regra .rt{white-space:pre-wrap;word-break:break-word;margin-bottom:8px}
.regra.off .rt{color:var(--txt2);text-decoration:line-through}
.rb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rb .btn.mini{width:auto;flex:1 1 120px;min-height:48px}
.rb .ico:disabled{opacity:.35}
.codigo-box{text-align:center;background:var(--pri-suave);border-radius:12px;padding:12px;margin:12px 0}
.codigo{font:700 34px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:4px;word-break:break-all;user-select:all}
.fx3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px}
.fx3 select,.fx3 input{padding:8px 4px;min-width:0}
.g2{font-size:26px;width:36px;text-align:center}
.lkb{background:none;border:0;cursor:pointer;padding:10px 0;font:inherit;text-decoration:underline;min-height:44px}
.esp{background:var(--bg)}
</style>
</head>
<body>
<header class="topo"><h1 id="titulo">Motora Teste</h1><div id="acaoTopo"></div></header>
<main id="tela" aria-live="polite"></main>
<nav class="barra oculto" id="barra" aria-label="Menu">
 <button data-t="inicio"><span class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></span>Início<span class="badge oculto"></span></button>
 <button data-t="agenda"><span class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Agenda</button>
 <button data-t="conversas"><span class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><circle cx="8" cy="10" r="1"/><circle cx="12" cy="10" r="1"/><circle cx="16" cy="10" r="1"/></svg></span>Conversas<span class="badge oculto"></span></button>
 <button data-t="clientes"><span class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/><circle cx="17" cy="9" r="2.5"/></svg></span>Clientes</button>
 <button data-t="mais"><span class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></span>Mais</button>
</nav>
<div class="fundo" id="fundo"></div>
<div class="folha" id="folha" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"><span id="toastTx"></span><button id="toastBt" class="oculto"></button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script id="core">

/* ===== Funções puras (sem DOM). Testadas em Node pelo test.js ===== */
var REGRAS_PADRAO = [
  'Horários de início (cada reserva dura 1 hora):',
  '- Segunda e quarta: 19h, 20h, 21h e 22h.',
  '- Terça e quinta: 20h, 21h e 22h.',
  '- Sexta: 17h, 18h, 19h, 20h, 21h e 22h.',
  '- Sábado: 8h e 9h.',
  '- Domingo: fechado.',
  'Temos 2 campos (Campo 1 e Campo 2).',
  'Clientes fixos têm prioridade. Avulsos só podem reservar horários livres.',
  'Confirmação dos fixos: no dia anterior de manhã; se não responder, nova tentativa à tarde.',
  'Preço: se não estiver informado, NUNCA invente valor. Diga que vai confirmar e já retorna.'
].join('\n');

var DIAS_CURTO = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
var DIAS_LONGO = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];

function defaults() {
  return {
    versao: 1,
    config: {
      nomeDono: '', regras: REGRAS_PADRAO, preco: '',
      grade: { 1: [19, 20, 21, 22], 2: [20, 21, 22], 3: [19, 20, 21, 22], 4: [20, 21, 22], 5: [17, 18, 19, 20, 21, 22], 6: [8, 9], 0: [] },
      campos: { 1: 'Campo 1', 2: 'Campo 2' },
      msgManha: 'Bom dia {nome}! Confirma o futebol amanhã ({dia}) às {hora}h no {campo}?',
      msgTarde: 'Oi {nome}, ainda não tive retorno: amanhã ({dia}) {hora}h no {campo}, confirma?',
      ia: { geminiKey: '', geminiModel: 'gemini-3.5-flash-lite', groqKey: '', groqModel: 'llama-3.3-70b-versatile' },
      evo: { url: '', apikey: '', instancia: '' }
    },
    clientes: [], reservas: [], excecoes: [], confirmacoes: {}, conversas: [], ultimoBackup: 0
  };
}

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function ehObj(o) { return o !== null && typeof o === 'object' && !Array.isArray(o); }

function mesclaDefaults(salvo) {
  var d = defaults();
  if (!ehObj(salvo)) return d;
  var s = clone(salvo);
  var c = ehObj(s.config) ? s.config : {};
  var cfg = Object.assign({}, d.config, c);
  cfg.ia = Object.assign({}, d.config.ia, ehObj(c.ia) ? c.ia : {});
  cfg.evo = Object.assign({}, d.config.evo, ehObj(c.evo) ? c.evo : {});
  cfg.grade = Object.assign({}, d.config.grade, ehObj(c.grade) ? c.grade : {});
  cfg.campos = Object.assign({}, d.config.campos, ehObj(c.campos) ? c.campos : {});
  return {
    versao: 1, config: cfg,
    clientes: Array.isArray(s.clientes) ? s.clientes : [],
    reservas: Array.isArray(s.reservas) ? s.reservas : [],
    excecoes: Array.isArray(s.excecoes) ? s.excecoes : [],
    confirmacoes: ehObj(s.confirmacoes) ? s.confirmacoes : {},
    conversas: Array.isArray(s.conversas) ? s.conversas : [],
    ultimoBackup: typeof s.ultimoBackup === 'number' ? s.ultimoBackup : 0
  };
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}

/* ---- Datas (sempre locais, nunca toISOString) ---- */
function p2(n) { return (n < 10 ? '0' : '') + n; }
function dataLocal(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function parseData(s) { var a = String(s).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2], 12); }
function dataValida(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return false;
  return dataLocal(parseData(s)) === s;
}
function somaDias(s, n) { var d = parseData(s); d.setDate(d.getDate() + n); return dataLocal(d); }
function diaSemana(s) { return parseData(s).getDay(); }
function nomeDia(s) { return DIAS_CURTO[diaSemana(s)]; }
function formataDataBR(s) { var a = String(s).split('-'); return a[2] + '/' + a[1]; }
function chave(data, hora, campo) { return data + '|' + Number(hora) + '|' + Number(campo); }
function nomeCampo(db, campo) { return (db.config.campos && db.config.campos[campo]) || ('Campo ' + campo); }
function listaCampos(db) { return Object.keys(db.config.campos || { 1: 1, 2: 2 }).map(Number).sort(); }

/* ---- Agenda ---- */
function horariosDoDia(db, data) {
  var g = (db.config.grade || {})[diaSemana(data)] || [];
  return g.map(Number).sort(function (a, b) { return a - b; });
}
function clientePorId(db, id) {
  for (var i = 0; i < db.clientes.length; i++) if (db.clientes[i].id === id) return db.clientes[i];
  return null;
}
function fixoDe(db, data, hora, campo) {
  var dia = diaSemana(data);
  for (var i = 0; i < db.clientes.length; i++) {
    var c = db.clientes[i];
    if (c.tipo !== 'fixo' || !Array.isArray(c.fixos)) continue;
    for (var j = 0; j < c.fixos.length; j++) {
      var f = c.fixos[j];
      if (Number(f.dia) === dia && Number(f.hora) === Number(hora) && Number(f.campo) === Number(campo)) return c;
    }
  }
  return null;
}
function temExcecao(db, data, hora, campo, clienteId) {
  return db.excecoes.some(function (e) {
    return e.data === data && Number(e.hora) === Number(hora) && Number(e.campo) === Number(campo) &&
      (clienteId == null || e.clienteId === clienteId);
  });
}
function reservaEm(db, data, hora, campo) {
  for (var i = 0; i < db.reservas.length; i++) {
    var r = db.reservas[i];
    if (r.data === data && Number(r.hora) === Number(hora) && Number(r.campo) === Number(campo)) return r;
  }
  return null;
}
function statusDe(db, data, hora, campo) {
  var c = db.confirmacoes[chave(data, hora, campo)];
  return (c && c.status) || 'pendente';
}
function ocupante(db, data, hora, campo) {
  var r = reservaEm(db, data, hora, campo);
  if (r) return { tipo: 'avulso', reserva: r, cliente: clientePorId(db, r.clienteId) };
  var f = fixoDe(db, data, hora, campo);
  if (f && !temExcecao(db, data, hora, campo, f.id)) return { tipo: 'fixo', cliente: f, status: statusDe(db, data, hora, campo) };
  if (f) return { tipo: 'livre', naoVem: f };
  return { tipo: 'livre' };
}
function livresProximosDias(db, n, hoje) {
  var base = dataLocal(hoje), agoraH = hoje.getHours(), out = [], campos = listaCampos(db);
  for (var i = 0; i < n; i++) {
    var data = somaDias(base, i);
    horariosDoDia(db, data).forEach(function (h) {
      if (i === 0 && h <= agoraH) return;
      campos.forEach(function (c) {
        if (ocupante(db, data, h, c).tipo === 'livre') out.push({ data: data, dia: nomeDia(data), hora: h, campo: c });
      });
    });
  }

      var k = i.getAttribute('data-k'), tp = i.getAttribute('data-tp'), v = i.value, rot = i.getAttribute('data-rot');
      if (tp === 'bool') v = v === '1';
      else if (tp === 'num') { v = numOuNulo(v); if (v == null || v < 0) { erros.push(rot); return; } }
      else if (tp === 'numn') { if (String(v).trim() !== '' && numOuNulo(v) == null) { erros.push(rot); return; } v = numOuNulo(v); }

  async function aplicaMigracao() {
    var l = est.migr.linhas;
    if (l.clientes.length) await q(sb.from('clientes').upsert(l.clientes, { onConflict: 'id' }));
    if (l.horarios_fixos.length) await q(sb.from('horarios_fixos').insert(l.horarios_fixos));
    if (l.reservas.length) await q(sb.from('reservas').upsert(l.reservas, { onConflict: 'id' }));
    if (l.excecoes.length) await q(sb.from('excecoes').insert(l.excecoes));
    if (l.confirmacoes.length) await q(sb.from('confirmacoes').upsert(l.confirmacoes, { onConflict: 'data,hora,campo' }));
    if (l.conversas_exemplo.length) await q(sb.from('conversas_exemplo').insert(l.conversas_exemplo));
    if (l.regras.length) await q(sb.from('regras').insert(l.regras));
    var cd = clone(l.configDados);
    if (cfg().nome_dono) delete cd.nome_dono;
    if (cfg().precos.observacao) delete cd.precos;
    await salvaCfg(cd, ['grade', 'campos']);
    var ch = {};
    if (l.chaves.gemini_key && !L.config.gemini_key) ch.gemini_key = l.chaves.gemini_key;
    if (l.chaves.groq_key && !L.config.groq_key) ch.groq_key = l.chaves.groq_key;
    if (Object.keys(ch).length) await q(sb.from('config').update(ch).eq('id', 1));
    est.migr = null; est.tela = 'clientes';
  }

    },
    pausaOp: function (b) {
      var ate = pausaAte(b.getAttribute('data-op'), Date.now()), tel = est.conv;
      fechaFolha();
      return faz(async function () {
        var c = L.contatos.filter(function (x) { return x.telefone === tel; })[0];
        if (c) await q(sb.from('contatos').update({ pausado_ate: ate, motivo_pausa: 'pausado pelo dono' }).eq('telefone', tel));
        else await q(sb.from('contatos').upsert({ telefone: tel, pausado_ate: ate, motivo_pausa: 'pausado pelo dono' }, { onConflict: 'telefone' }));
      }, 'IA pausada neste contato ✓');
    },
    despausar: function () {
      var tel = est.conv;
      return faz(function () { return q(sb.from('contatos').update({ pausado_ate: null, motivo_pausa: null }).eq('telefone', tel)); }, 'IA voltou neste contato ✓');
    },

    /* agenda */
    diaAnt: function () { est.data = somaDias(est.data, -1); render(); },
    diaProx: function () { est.data = somaDias(est.data, 1); render(); },
    diaHoje: function () { est.data = dataLocal(agora()); render(); },
    cel: function (b) { var x = dadosCel(b); folhaCelula(x.h, x.c); },
    pago: function (b) { var id = b.getAttribute('data-id'); fechaFolha(); return faz(function () { return q(sb.from('reservas').update({ pago: true }).eq('id', id)); }, 'Pago ✓'); },
    naoPago: function (b) { var id = b.getAttribute('data-id'); fechaFolha(); return faz(function () { return q(sb.from('reservas').update({ pago: false }).eq('id', id)); }, 'Salvo ✓'); },
    cancelaRes: function (b) {
      var id = b.getAttribute('data-id');
      confirma('A reserva será cancelada e o horário fica livre.', 'Cancelar reserva', function () { return faz(function () { return q(sb.from('reservas').delete().eq('id', id)); }, 'Reserva cancelada ✓'); });
    },
    confirmou: function (b) { var x = dadosCel(b); fechaFolha(); return faz(function () { return upConf(x.d, x.h, x.c, { status: 'confirmado', respondido_em: agoraIso() }); }, 'Salvo ✓'); },
    naoVem: function (b) {
      var x = dadosCel(b);
      confirma('O horário ficará livre para avulso só nesta data.', 'Não vem desta vez', function () { return faz(function () { return naoVem(x.d, x.h, x.c); }, 'Salvo ✓'); });
    },
    desfazNaoVem: function (b) { var x = dadosCel(b); fechaFolha(); return faz(function () { return desfazNaoVem(x.d, x.h, x.c); }, 'Salvo ✓'); },
    reservar: function (b) {
      var x = dadosCel(b), cid = $('selCliRes') && $('selCliRes').value;
      var r = reservarAvulso(db, { data: x.d, hora: x.h, campo: x.c, clienteId: cid });
      fechaFolha();
      if (!r.ok) { toast('⚠ ' + r.erro, true); return; }
      var nv = r.reserva;
      return faz(function () { return q(sb.from('reservas').insert({ id: nv.id, data: nv.data, hora: nv.hora, campo: nv.campo, cliente_id: nv.clienteId, pago: false, origem: 'dono' })); }, 'Reserva feita ✓');
    },
    novoCliRes: function () { fechaFolha(); est.tela = 'clientes'; est.editCli = { nome: '', telefone: '', tipo: 'avulso', fixos: [] }; render(); },

    /* clientes */
    novoCli: function () { est.editCli = { nome: '', telefone: '', tipo: 'avulso', fixos: [] }; render(); window.scrollTo(0, 0); },
    editCli: function (b) { var c = clientePorId(db, b.getAttribute('data-cid')); if (c) { est.editCli = clone(c); render(); window.scrollTo(0, 0); } },
    cancelaCli: function () { est.editCli = null; render(); },
    addFixo: function () {
      lerFormCli();
      var dia = diasAbertos()[0];
      if (dia == null) { toast('⚠ Nenhum dia com horário. Veja Ajustes › Grade e campos.', true); return; }
      est.editCli.fixos = (est.editCli.fixos || []).concat([{ dia: dia, hora: db.config.grade[dia][0], campo: listaCampos(db)[0] }]); render();
    },
    delFixo: function (b) { lerFormCli(); est.editCli.fixos.splice(Number(b.getAttribute('data-i')), 1); render(); },
    salvaCli: function () {
      lerFormCli();
      var c = est.editCli;
      if (String(c.telefone || '').trim() && !telefoneOk(c.telefone)) { toast('⚠ Telefone parece incompleto. Use DDD + número.', true); return; }
      if (c.tipo === 'fixo' && !(c.fixos || []).length) { toast('⚠ Adicione pelo menos um horário fixo.', true); return; }
      var r = salvarCliente(db, clone(c));
      if (!r.ok) { toast('⚠ ' + r.erro, true); return; }
      return faz(async function () { await gravaCliente(r.cliente); est.editCli = null; }, 'Salvo ✓');
    },
    removeCli: function () {
      var id = est.editCli.id, nome = est.editCli.nome;
      confirma('Apagar ' + nome + ' e as reservas dele?', 'Apagar cliente', function () {
        return faz(async function () { await q(sb.from('clientes').delete().eq('id', id)); est.editCli = null; }, 'Cliente apagado ✓');
      });
    },

    /* confirmar */
    enviaConf: function (b) {
      var x = dadosCel(b), item = fixosDeAmanha(db, agora()).filter(function (i) { return i.hora === x.h && i.campo === x.c; })[0];
      if (!item) return;
      if (!item.cliente.telefone) { toast('⚠ Esse cliente está sem telefone.', true); return; }
      var texto = textoDaConfirmacao(db, item), prox = proximoStatus(item.status), online = roboOnline();
      if (!online) window.open('https://wa.me/' + normalizaTelefone(item.cliente.telefone) + '?text=' + encodeURIComponent(texto), '_blank');
      return faz(async function () {
        if (online) await enviaManual(item.cliente.telefone, texto, item.cliente.id, 'confirmacao');
        var extra = { status: prox }; extra[prox === 'manha' ? 'manha_em' : 'tarde_em'] = agoraIso();
        await upConf(x.d, x.h, x.c, extra);
      }, online ? 'Na fila ✓ Vai sair pelo robô.' : 'Robô fora do ar: abri o WhatsApp.');
    },
    confirmouC: function (b) { return ACOES.confirmou(b); },
    naoVemC: function (b) { var x = dadosCel(b); return faz(function () { return naoVem(x.d, x.h, x.c); }, 'Salvo ✓ Horário livre para avulso.'); },
    desfazNaoVemC: function (b) { return ACOES.desfazNaoVem(b); },

    /* regras */
    addRegra: function () {
      var t = String($('novaRegra') ? $('novaRegra').value : est.novaRegra).trim();
      if (!t) { toast('⚠ Escreva a regra primeiro.', true); return; }
      var ordem = db.regras.reduce(function (m, r) { return Math.max(m, r.ordem); }, 0) + 1;
      return faz(async function () { await q(sb.from('regras').insert({ texto: t, ativa: true, ordem: ordem })); est.novaRegra = ''; }, 'Regra adicionada ✓');
    },
    ligaRegra: function (b) { var r = regraPorId(b.getAttribute('data-id')); if (!r) return; return faz(function () { return q(sb.from('regras').update({ ativa: !r.ativa }).eq('id', r.id)); }, r.ativa ? 'Regra desligada ✓' : 'Regra ligada ✓'); },
    editaRegra: function (b) { var r = regraPorId(b.getAttribute('data-id')); if (r) { est.editRegra = r.id; render(); } },
    cancelaRegra: function () { est.editRegra = null; render(); },
    salvaRegra: function (b) {
      var r = regraPorId(b.getAttribute('data-id')), t = $('edRegra').value.trim();
      if (!t) { toast('⚠ A regra está vazia.', true); return; }
      return faz(async function () { await q(sb.from('regras').update({ texto: t }).eq('id', r.id)); est.editRegra = null; }, 'Salvo ✓');
    },
    sobeRegra: function (b) { return moveRegra(b.getAttribute('data-id'), -1); },
    desceRegra: function (b) { return moveRegra(b.getAttribute('data-id'), 1); },
    apagaRegra: function (b) {
      var r = regraPorId(b.getAttribute('data-id')); if (!r) return;
      confirma('Apagar a regra "' + r.texto.slice(0, 60) + '"?', 'Apagar regra', function () { return faz(function () { return q(sb.from('regras').delete().eq('id', r.id)); }, 'Regra apagada ✓'); });
    },
    simular: async function () {
      var t = String($('simTexto') ? $('simTexto').value : est.simTexto).trim();
      if (!t) { toast('⚠ Escreva a mensagem do cliente.', true); return; }
      est.simTexto = t; est.simCarregando = true; est.simRes = null; render();
      try {
        var corpo = { acao: 'simular', texto: t };
        if (est.simTel) corpo.telefone = est.simTel;
        est.simRes = await invocar(corpo);
      } catch (e) { est.simRes = { erro: msgErro(e) }; }
      est.simCarregando = false; render();
    },

    /* ajustes */
    salvaSec: function (b) {
      var id = b.getAttribute('data-sec'), el = document.querySelector('[data-sec="' + id + '"]');
      var r = lerSecao(el), subst = [];
      if (r.erros.length) { toast('⚠ Confira: ' + r.erros.join(', ') + '.', true); return; }
      var p = r.patch;
      if (p.atraso_resposta_seg && p.atraso_resposta_seg.min > p.atraso_resposta_seg.max) { toast('⚠ O mínimo não pode ser maior que o máximo.', true); return; }
      if (id === 'precos') {
        var esp = [], erroEsp = false;
        Array.prototype.forEach.call(el.querySelectorAll('[data-esp]'), function (c) {
          function v(k) { return c.querySelector('[data-e="' + k + '"]').value; }
          var av = numOuNulo(v('avulso')), fx = numOuNulo(v('fixo'));
          if ((String(v('avulso')).trim() && av == null) || (String(v('fixo')).trim() && fx == null)) erroEsp = true;
          esp.push({ dias: parseNums(v('dias'), 0, 6), horas: parseNums(v('horas'), 0, 23), campos: parseNums(v('campos'), 1, 9), avulso: av, fixo: fx });
        });
        if (erroEsp) { toast('⚠ Confira os valores dos preços especiais.', true); return; }
        p.precos.especiais = esp;
      }
      if (id === 'confirmacao' && p.liberar_fixo_sem_resposta && p.liberar_fixo_sem_resposta.hora > p.confirmacao_ultima_hora) {
        toast('⚠ A hora de liberar o fixo (' + p.liberar_fixo_sem_resposta.hora + ') precisa ser até a hora limite das confirmações (' + p.confirmacao_ultima_hora + ').', true); return;
      }
      if (id === 'horario') {
        var jan = {}, erroJ = false;
        Array.prototype.forEach.call(el.querySelectorAll('[data-dia]'), function (d) {
          var liga = d.querySelector('[data-j="liga"]').value === '1', ini = d.querySelector('[data-j="inicio"]').value, fim = d.querySelector('[data-j="fim"]').value;
          if (liga && (!horaOk(ini) || !horaOk(fim))) erroJ = true;
          jan[d.getAttribute('data-dia')] = liga ? { inicio: ini, fim: fim } : null;
        });
        if (erroJ) { toast('⚠ Confira as horas de início e fim.', true); return; }
        p.horario_ia.janelas = jan;
      }
      if (id === 'grade') {
        var nomes = $('gCampos').value.split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 9);
        if (!nomes.length) { toast('⚠ Escreva o nome de pelo menos um campo.', true); return; }
        p.campos = {}; nomes.forEach(function (n, i) { p.campos[i + 1] = n; });
        subst.push('campos');
      }
      return faz(function () { return salvaCfg(p, subst); }, 'Salvo ✓', true);
    },
    addEsp: function () {
      var el = document.querySelector('[data-sec="precos"]'), r = lerSecao(el);
      var n = clone(cfg().precos.especiais || []); n.push({ dias: [], horas: [], campos: [], avulso: null, fixo: null });
      db.cfg.precos.especiais = n; render(); var d = document.querySelector('[data-sec="precos"]'); if (d) d.open = true;
      if (r) { /* valores digitados nas outras caixas ficam como estavam salvos */ }
    },
    delEsp: function (b) {
      var n = clone(cfg().precos.especiais || []); n.splice(Number(b.getAttribute('data-i')), 1);
      db.cfg.precos.especiais = n; render(); var d = document.querySelector('[data-sec="precos"]'); if (d) d.open = true;
      toast('Removido. Toque em Salvar para confirmar.');
    },
    salvaChaves: function () {
      var g = $('cGem').value.trim(), k = $('cGroq').value.trim();
      return faz(async function () { await q(sb.from('config').update({ gemini_key: g, groq_key: k, atualizado_em: agoraIso() }).eq('id', 1)); }, 'Chaves salvas ✓');
    },
    olho: function (b) { var i = $(b.getAttribute('data-alvo')); if (i) { var m = i.type === 'password'; i.type = m ? 'text' : 'password'; b.setAttribute('aria-label', m ? 'Esconder' : 'Mostrar'); b.textContent = m ? '🙈' : '👁'; } },
    delConv: function (b) {
      var id = Number(b.getAttribute('data-id'));
      confirma('Remover esta conversa de exemplo?', 'Remover', function () { return faz(function () { return q(sb.from('conversas_exemplo').delete().eq('id', id)); }, 'Removido ✓'); });
    },
    gerarCodigo: function () {
      var faca = function () {
        return faz(async function () { est.codigo = await q(sb.rpc('gerar_codigo_robo')); }, 'Código novo ✓', true);
      };
      if (est.codigo || estadoRobo(L.robo, Date.now()) !== 'nunca') confirma('O código antigo deixa de valer. O robô vai pedir o código novo.', 'Gerar código novo', faca, false);
      else return faca();
    },

    /* migração */
    migrarLocal: function () { preparaMigracao(lerAntigo()); },
    migrarCancela: function () { est.migr = null; render(); },
    migrarOk: function () { return faz(aplicaMigracao, 'Dados trazidos ✓'); }
  };
  function moveRegra(id, dir) {
    var i = -1; db.regras.forEach(function (r, j) { if (String(r.id) === String(id)) i = j; });
    var j = i + dir; if (i < 0 || j < 0 || j >= db.regras.length) return;
    var a = db.regras[i], b = db.regras[j];
    var oa = a.ordem === b.ordem ? a.ordem + dir : b.ordem, ob = a.ordem === b.ordem ? a.ordem : a.ordem;
    return faz(async function () {
      await q(sb.from('regras').update({ ordem: oa }).eq('id', a.id));
      await q(sb.from('regras').update({ ordem: ob }).eq('id', b.id));
    }, 'Ordem salva ✓');
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var f = ACOES[b.getAttribute('data-a')]; if (!f) return;
    e.preventDefault();
    try { var p = f(b, e); if (p && p.catch) p.catch(function (er) { est.ocupado = false; toast('⚠ ' + msgErro(er), true); }); }
    catch (err) { toast('⚠ Algo deu errado. Tente de novo.', true); }
  });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-in');
    if (k) est[k] = e.target.value;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && est.fase === 'login' && e.target && e.target.id === 'lSenha') { e.preventDefault(); ACOES.entrar(); }
  });
  document.addEventListener('change', async function (e) {
    var el = e.target, k = el.getAttribute && el.getAttribute('data-ch'); if (!k) return;
    if (k === 'tipoCli') { lerFormCli(); est.editCli.tipo = el.value; if (el.value === 'fixo' && !(est.editCli.fixos || []).length) { ACOES.addFixo(); return; } render(); }
    else if (k === 'fxDia' || k === 'fxHora' || k === 'fxCampo') {
      lerFormCli();
      var f = est.editCli.fixos[Number(el.getAttribute('data-i'))];
      if (k === 'fxDia') { f.dia = Number(el.value); var g = db.config.grade[f.dia] || []; if (g.indexOf(Number(f.hora)) < 0) f.hora = g[0]; }
      else if (k === 'fxHora') f.hora = Number(el.value); else f.campo = Number(el.value);
      var outro = conflitoFixo(db, f, est.editCli.id);
      render();
      if (outro) toast('⚠ Esse horário já é de outro cliente fixo. (' + outro.nome + ')', true);
    }
    else if (k === 'simTel') est.simTel = el.value;
    else if (k === 'arqTxt') {
      var arqs = Array.prototype.slice.call(el.files || []), novos = [];
      for (var i = 0; i < arqs.length; i++) {
        try { novos.push({ nome_arquivo: arqs[i].name, texto: cortaConversa(await lerArquivo(arqs[i]), 15000) }); } catch (er) { /* pula */ }
      }
      try { el.value = ''; } catch (er0) { /* ignora */ }
      if (!novos.length) { toast('⚠ Não consegui ler o arquivo.', true); return; }
      var ok = await faz(async function () {
        var nomes = novos.map(function (n) { return n.nome_arquivo; });
        await q(sb.from('conversas_exemplo').delete().in('nome_arquivo', nomes));
        await q(sb.from('conversas_exemplo').insert(novos));
      }, novos.length + (novos.length > 1 ? ' conversas importadas ✓' : ' conversa importada ✓'));
      if (ok) { var d = $('secConv'); if (d) d.open = true; }
    }
    else if (k === 'arqBk') {
      var a = el.files && el.files[0]; if (!a) return;
      var obj = null;
      try { obj = JSON.parse(await lerArquivo(a)); } catch (er2) { obj = null; }
      el.value = '';
      preparaMigracao(obj);
    }
  });
  window.addEventListener('offline', function () { toast('⚠ Sem internet. Os dados voltam quando a internet voltar.'); });
  window.addEventListener('online', function () { atualizaFundo(true); });

  /* ---------- início ---------- */
  async function entrouNaConta(sessao) {
    if (!sessao) { est.fase = 'login'; render(); return; }
    est.email = (sessao.user && sessao.user.email) || est.email;
    est.fase = 'carregando'; render();
    try {
      var dono = await q(sb.rpc('reivindicar_dono'));
      if (!dono) { est.fase = 'naoDono'; render(); return; }
      est.fase = 'app';
      await recarregar(true);
      ligaTempoReal();
    } catch (e) {
      est.fase = 'app';
      toast('⚠ ' + msgErro(e), true);
    }
    render();
  }
  async function iniciar() {
    if (!window.supabase || !window.supabase.createClient) { est.fase = 'semLib'; render(); return; }
    sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    var r = await sb.auth.getSession();
    var s = r && r.data && r.data.session;
    if (s) await entrouNaConta(s); else { est.fase = 'login'; render(); }
    sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT' && est.fase === 'app') { est.fase = 'login'; render(); } });
  }
  render();
  iniciar().catch(function (e) { est.fase = 'login'; est.erroLogin = msgErro(e); render(); });

  try {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () { /* ignora */ }); });
    }
  } catch (e) { /* ignora */ }
})();
</script>
</body>
</html>
